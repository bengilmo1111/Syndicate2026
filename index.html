<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syndicate 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas" width="1024" height="768" aria-label="Syndicate 2026 game canvas"></canvas>

    <div id="hud-top">
      <div class="hud-panel"><span class="hud-label">OBJECTIVE</span><span id="hud-objective">—</span></div>
      <div class="hud-panel"><span class="hud-label">HOSTILES DOWN</span><span id="hud-kills">0</span></div>
      <div class="hud-panel"><span class="hud-label">FOLLOWERS</span><span id="hud-followers">0</span></div>
      <div class="hud-panel hud-heat">
        <span class="hud-label">HEAT</span>
        <div class="heat-meter"><div id="hud-heat-fill" class="heat-meter-fill"></div></div>
      </div>
      <div class="hud-panel"><span class="hud-label">MISSION TIME</span><span id="hud-time">00:00</span></div>
    </div>
    <div id="hud-mode" class="hidden">PERSUADERTRON ENGAGED</div>

    <div id="hud-squad" aria-label="Squad status"></div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h1 id="overlay-title">SYNDICATE 2026</h1>
        <div id="overlay-body"></div>
        <button id="overlay-button">DEPLOY SQUAD</button>
        <p id="overlay-hint" class="hint"></p>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
