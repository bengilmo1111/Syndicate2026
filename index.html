<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syndicate 2026</title>
  <meta name="description" content="A squad-tactics reimagining of Syndicate Wars. Five syndicates. One resource: compute." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070910'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%236fe3d0'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%236fe3d0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas" aria-label="Syndicate 2026 — 3D city view"></canvas>

    <div id="hud-top">
      <div class="hud-panel wide"><span class="hud-label">OBJECTIVE</span><span id="hud-objective">—</span></div>
      <div class="hud-panel"><span class="hud-label">HOSTILES DOWN</span><span id="hud-kills">0</span></div>
      <div class="hud-panel"><span class="hud-label">ALIGNED</span><span id="hud-aligned">0</span></div>
      <div class="hud-panel"><span class="hud-label">CIVILIAN LOSSES</span><span id="hud-losses">0</span></div>
      <div class="hud-panel hud-heat">
        <span class="hud-label">HEAT</span>
        <div class="heat-meter"><div id="hud-heat-fill" class="heat-meter-fill"></div></div>
      </div>
      <div class="hud-panel"><span class="hud-label">ELAPSED</span><span id="hud-time">00:00</span></div>
      <button id="hud-fullscreen" class="hud-panel hud-button"
              title="Fullscreen (Alt+Enter)" aria-label="Toggle fullscreen">
        <span class="hud-label">VIEW</span><span id="hud-fullscreen-label">⛶ FULL</span>
      </button>
    </div>

    <div id="hud-alert" class="hidden">// LOCAL ENFORCEMENT INBOUND</div>
    <div id="hud-mode" class="hidden">ALIGNER ENGAGED</div>

    <div id="objective-panel" class="hidden">
      <div class="panel-head">
        <span id="objective-mission">—</span>
        <small id="objective-sector"></small>
      </div>
      <ul id="objective-list"></ul>
      <p class="panel-foot">TAB to close</p>
    </div>

    <div id="hud-subtitle" class="hidden" aria-live="polite">
      <span id="subtitle-speaker"></span>
      <span id="subtitle-text"></span>
    </div>

    <div id="hud-compute" aria-label="Compute allocation">
      <div class="compute-head">
        <span>COMPUTE ALLOCATION</span>
        <span id="compute-surge" class="surge-badge">SURGE</span>
      </div>
      <div id="compute-channels"></div>
      <p id="compute-throttle" class="compute-foot hidden"></p>
    </div>

    <div id="hud-squad" aria-label="Deployment status"></div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <p id="overlay-eyebrow" class="eyebrow"></p>
        <h1 id="overlay-title">SYNDICATE 2026</h1>
        <div id="overlay-tabs" class="mission-tabs hidden"></div>
        <div id="overlay-body"></div>
        <div id="overlay-choices" class="overlay-choices hidden"></div>
        <div id="overlay-actions" class="overlay-actions">
          <button id="overlay-button">DEPLOY</button>
          <button id="overlay-alt-button" class="secondary hidden"></button>
        </div>
        <p id="overlay-hint" class="hint"></p>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
